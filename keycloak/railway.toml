# Deployed as its own Railway service with Root Directory set to `keycloak/`.
#
# Variables the service needs (none can be baked into the image — the database
# credentials are Railway's to generate, and the hostname is the domain you
# generate for THIS service, not for the site):
#
#   KC_DB_URL                 jdbc:postgresql://${{Postgres.PGHOST}}:${{Postgres.PGPORT}}/${{Postgres.PGDATABASE}}
#   KC_DB_USERNAME            ${{Postgres.PGUSER}}
#   KC_DB_PASSWORD            ${{Postgres.PGPASSWORD}}
#   KC_HOSTNAME               https://<this-service>.up.railway.app
#
# Those three references name the Postgres service, so the service has to
# already be called `Postgres` when they are written. Railway resolves a
# reference to a missing service as an empty string rather than refusing it,
# which turns the URL above into `jdbc:postgresql://:/` and is not visible
# anywhere until Keycloak fails to reach a database it can't name. Renaming
# the service later does not fix variables already written; re-enter them.
#
# KC_HOSTNAME must match the generated domain exactly, including the scheme.
# The service's own name is not involved and may differ from its domain.
#   KC_HTTP_ENABLED           true      (Railway terminates TLS at its edge)
#   KC_PROXY_HEADERS          xforwarded
#   KC_BOOTSTRAP_ADMIN_USERNAME / KC_BOOTSTRAP_ADMIN_PASSWORD
#
# The bootstrap admin is spent on first boot: it creates the permanent admin
# account and is then ignored. Change the password in the console afterwards
# and the variables stop mattering.
#
# KC_HTTP_ENABLED is the one that looks alarming and isn't. Keycloak refuses
# plain HTTP by default because it assumes it faces the internet; here it faces
# Railway's edge, which has already terminated TLS. KC_PROXY_HEADERS is what
# stops that being a hole — without it Keycloak would trust an X-Forwarded-Proto
# from anyone.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Keycloak holds its state in Postgres, so a restart costs only the boot time.
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

# No healthcheckPath, and not by oversight. Since Keycloak 25 the health
# endpoints live on the *management* interface — port 9000 — while Railway
# probes the port it routes traffic to, 8080. `/health/ready` there is not
# "not ready yet", it is "no such endpoint", so the check fails for the full
# retry window and then marks a perfectly healthy deploy as failed.
#
# Moving them back with http-management-health-enabled=false is possible, but
# it is a build-time option on an --optimized image: get that wrong and the
# server refuses to boot at all, which is a worse failure than having no
# readiness gate on a service one person signs in to.
#
# The cost of leaving it out: Railway may route a request during the JVM's
# first few seconds and the browser sees one 502. Reload and it is there.
